[alembic]
# Chemin vers le dossier des migrations
script_location = backend/database/migrations

# URL de la base de donnees (override possible via env var)
sqlalchemy.url = sqlite+aiosqlite:///./data/forex_bot.db

# Timezone pour les timestamps de migration
timezone = UTC

# Longueur max des lignes dans les fichiers de migration
line_length = 100

# Template pour les noms de fichiers de migration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Dossier pour les fichiers de version
version_locations = %(here)s/backend/database/migrations/versions

[post_write_hooks]
# Formater automatiquement les fichiers de migration avec black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
